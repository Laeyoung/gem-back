name: Release to npm

on:
  push:
    tags:
      - 'v*'

# Required for npm provenance (OIDC). `contents: write` lets the workflow
# create the accompanying GitHub Release.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package.json version
        # Hard guard: a tag like v0.7.0 must match package.json "version": "0.7.0".
        # Prevents accidentally publishing a mismatched version.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Upgrade npm (OIDC trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build + run tests (prepublishOnly gate)
        run: npm run prepublishOnly

      # OIDC trusted publishing: npm authenticates via the workflow's id-token
      # (configured as a trusted publisher on npmjs.com for this repo +
      # release.yml). No NPM_TOKEN needed — nothing to leak or rotate.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Marks the release as a prerelease if the tag has a hyphen (e.g. v0.7.0-rc.1)
          prerelease: ${{ contains(github.ref_name, '-') }}
